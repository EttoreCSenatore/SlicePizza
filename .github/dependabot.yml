# Dependabot opens Pull Requests that update the project's dependencies. Every PR runs the
# same checks as any other (tests, image build, docs site build), so nothing is merged blind.
# Security fixes come as separate PRs as soon as an advisory is published, outside this schedule.
#
# Cooldown: a version is only proposed once it has been public for 7 days. A hijacked or
# malicious release is usually found and pulled within hours or days, so waiting a week keeps
# it out. Security updates ignore the cooldown, so fixes for known vulnerabilities are not delayed.
#
# The "Dependabot release dates" workflow adds a table with each package's old and new versions
# and their release dates to every Dependabot PR, with a warning if a version is younger than 7 days.
version: 2

updates:
  # Orders API: the ranges in api/requirements*.in and the lock files generated from them
  # (requirements*.txt). Dependabot recognizes pip-compile files: its PRs change the pinned
  # versions and hashes in the lock files.
  - package-ecosystem: pip
    directory: /api
    # Version updates cover only the packages named in the .in files by default. With lock
    # files, the indirect ones (starlette, pydantic, anyio, certifi...) would then stay on the
    # locked version forever, so ask for all of them.
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor and patch updates in one PR a week; a major update gets a PR of its own.
      api-minor-and-patch:
        update-types: [minor, patch]

  # Notification worker: worker/requirements*.in and their lock files, like /api.
  - package-ecosystem: pip
    directory: /worker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    allow:
      - dependency-type: all
    groups:
      worker-minor-and-patch:
        update-types: [minor, patch]

  # Documentation site: docs-site/package.json.
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      # The @docusaurus/* packages must stay on the same version, so they move together.
      docusaurus:
        patterns: ["@docusaurus/*"]
      docs-site-minor-and-patch:
        update-types: [minor, patch]

  # Base image of api/Dockerfile (python:*-slim).
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # Base image of worker/Dockerfile (python:*-slim). CI fails until worker/.python-version
  # and the lock files follow a new Python, as for /api.
  - package-ecosystem: docker
    directory: /worker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # Base image of infra/caddy/Dockerfile (caddy:*-alpine): the public web container.
  - package-ecosystem: docker
    directory: /infra/caddy
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # Images in docker-compose.yml (postgres, rabbitmq). Dependabot only edits that file: when
  # it bumps rabbitmq, also bump the CI service in .github/workflows/ci.yml (worker tests)
  # and docs/DEPLOY.md, so the worker is tested against the version it runs with.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # A new Postgres major version needs a dump and restore of the data, and the server
      # runs the same version as docker-compose.yml. That upgrade is planned by hand.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # A RabbitMQ major version needs its feature flags enabled first and may
      # drop old queue types: also an upgrade to plan by hand.
      - dependency-name: rabbitmq
        update-types: ["version-update:semver-major"]

  # Actions used in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns: ["*"]
