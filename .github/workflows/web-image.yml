# Builds the web image: Caddy with the menu site, in front of the API (ADR 0003).
# On a Pull Request it only checks that the image builds; on main it publishes
# ghcr.io/senatoreteam/slicepizza-web, and the server that hosts
# slicepizza.senatore.tech picks up the new :latest within 5 minutes (see docs/DEPLOY.md).
name: Web image

on:
  push:
    branches: [main]
    paths: ["frontend/menu/**", "infra/caddy/**", ".dockerignore", ".github/workflows/web-image.yml"]
  pull_request:
    paths: ["frontend/menu/**", "infra/caddy/**", ".dockerignore", ".github/workflows/web-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/senatoreteam/slicepizza-web

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build (and publish, on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/caddy/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
