# Builds the Orders API image. On a Pull Request it only checks that the image builds;
# on main it publishes ghcr.io/senatoreteam/slicepizza-api, and the server that hosts
# senatore.tech picks up the new :latest within 5 minutes (see docs/DEPLOY.md).
name: API image

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api-image.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/senatoreteam/slicepizza-api

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Safety net: without api/Dockerfile there is nothing to build, so the job just passes.
      - name: Check for api/Dockerfile
        id: check
        run: |
          if [ -f api/Dockerfile ]; then echo "found=true" >> "$GITHUB_OUTPUT"
          else echo "found=false" >> "$GITHUB_OUTPUT"; echo "::notice::api/Dockerfile does not exist yet; skipping the image."; fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.found == 'true'

      - name: Log in to GHCR
        if: steps.check.outputs.found == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        if: steps.check.outputs.found == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build (and publish, on main)
        if: steps.check.outputs.found == 'true'
        uses: docker/build-push-action@v6
        with:
          context: api
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
