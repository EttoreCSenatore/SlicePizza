# Builds the Orders API image (the steps are in build-image.yml). On a Pull Request
# it only checks that the image builds; on main it publishes
# ghcr.io/senatoreteam/slicepizza-api, and the server that hosts
# slicepizza.senatore.tech picks up the new :latest within 5 minutes (see docs/DEPLOY.md).
name: API image

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api-image.yml", ".github/workflows/build-image.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api-image.yml", ".github/workflows/build-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    uses: ./.github/workflows/build-image.yml
    with:
      image: ghcr.io/senatoreteam/slicepizza-api
      context: api
      file: api/Dockerfile
