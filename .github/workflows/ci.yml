name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # The same suite on SQLite (fast) and on real Postgres, which catches what
    # SQLite does not: 32-bit integers, NUL characters, row locks...
    name: pytest (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            test_database_url: ""
          - database: postgres
            test_database_url: postgresql+psycopg://slicepizza:slicepizza@localhost:5432/slicepizza_test
    services:
      postgres:
        # An empty image skips the service, so only the postgres leg starts it.
        image: ${{ matrix.database == 'postgres' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: slicepizza
          POSTGRES_PASSWORD: slicepizza
          POSTGRES_DB: slicepizza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U slicepizza -d slicepizza_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.test_database_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: api/.python-version  # the image's Python (checked below)
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        working-directory: api
        # The same rules as the image: only the versions and hashes in the lock file, wheels only.
        run: pip install --require-hashes "--only-binary=:all:" -r requirements-dev.txt

      - name: Run tests
        working-directory: api
        run: pytest -q

  lock-files:
    # requirements*.txt are generated from requirements*.in. If someone edits an .in file
    # and forgets to regenerate, the image would not get the change: fail here instead.
    # api/ and worker/ each have their own lock files, checked the same way.
    name: lock files up to date (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v7

      # The lock files are resolved for one Python version, the one in <service>/.python-version.
      # Dependabot bumps the FROM line of the Dockerfile on its own, so a new Python in the
      # image must fail here until .python-version and the lock files follow it.
      - name: Same Python in the image and in .python-version
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          want="$(cat "$SERVICE/.python-version")"
          if ! grep -Eq "^FROM python:${want}-slim([@ ]|\$)" "$SERVICE/Dockerfile"; then
            echo "::error file=$SERVICE/Dockerfile::The FROM line of $SERVICE/Dockerfile is not python:${want}-slim ($SERVICE/.python-version). Update .python-version and regenerate the lock files (see $SERVICE/README.md#dependencies)."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version-file: ${{ matrix.service }}/.python-version

      - name: Regenerate the lock files
        run: ${{ matrix.service }}/scripts/compile-requirements.sh

      # Comment lines are ignored (the header and the "# via" notes depend on the pip-tools
      # version, and Dependabot runs its own); package versions, markers and hashes must match.
      # The script takes every hash from PyPI again, so a hash edited by hand shows up here.
      - name: Compare with the committed ones
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          if ! git diff --exit-code --ignore-matching-lines='^[[:space:]]*#' -- "$SERVICE/requirements*.txt"; then
            echo "::error::$SERVICE/requirements*.txt are out of date. Run $SERVICE/scripts/compile-requirements.sh (see $SERVICE/README.md#dependencies) and commit the result."
            exit 1
          fi

  worker-tests:
    # The worker's unit tests, plus its integration tests against a real RabbitMQ, the
    # same version as docker-compose.yml (RABBITMQ_TEST_HOST turns them on).
    name: pytest (worker)
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4.3.4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: slicepizza
          RABBITMQ_DEFAULT_PASS: slicepizza
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    env:
      RABBITMQ_TEST_HOST: localhost
      RABBITMQ_TEST_USER: slicepizza
      RABBITMQ_TEST_PASSWORD: slicepizza
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: worker/.python-version
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt

      - name: Install dependencies
        working-directory: worker
        # The same rules as the image: only the versions and hashes in the lock file, wheels only.
        run: pip install --require-hashes "--only-binary=:all:" -r requirements-dev.txt

      - name: Run tests
        working-directory: worker
        run: pytest -q

  docker-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start the stack and wait for health
        run: docker compose up -d --wait

      - name: Check health and menu
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/menu

      # The way customers come in: Caddy on 8080 serves the site and forwards /api to the API.
      - name: Check the site and the API through Caddy
        run: |
          # No folder is mounted over /srv (docker-compose.yml), so these are
          # the files inside the web image, as published.
          curl -fsS http://127.0.0.1:8080/ | grep -q "Pizzeria"
          curl -fsS http://127.0.0.1:8080/app.js | grep -q "SLICEPIZZA_CONFIG"
          curl -fsS http://127.0.0.1:8080/config.js | grep -q "apiUrl"
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "^content-security-policy: default-src 'self'"
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/api/menu > /dev/null
          # The interactive docs must load their schema through the /api prefix.
          curl -fsS http://127.0.0.1:8080/api/docs | grep -q "/api/openapi.json"
          curl -fsS http://127.0.0.1:8080/api/openapi.json > /dev/null
          # The worker-only /internal routes must never be reachable through Caddy (ADR 0006).
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:8080/api/internal/orders/x/telegram-subscriptions/1)" = 404
          curl -fsS -X POST http://127.0.0.1:8080/api/orders \
            -H "Content-Type: application/json" \
            -d '{"customer":{"name":"CI","phone":"+55 11 90000-0000","address":"Rua do Teste, 1"},"items":[{"pizza_id":1,"quantity":1}]}'

      # A new order and a status change reach a queue bound to the events exchange,
      # in order, with the right message properties (ADR 0004).
      - name: Check that order events reach RabbitMQ
        run: |
          set -a; . ./.env; set +a
          python3 .github/scripts/smoke_order_events.py

      # Phase 3's "done when": with the worker down, messages wait in its queue and are
      # handled when it comes back.
      - name: Check that messages wait for the worker
        run: |
          set -a; . ./.env; set +a
          python3 .github/scripts/smoke_worker_down.py

      - name: Dump logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
