name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # The same suite on SQLite (fast) and on real Postgres, which catches what
    # SQLite does not: 32-bit integers, NUL characters, row locks...
    name: pytest (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            test_database_url: ""
          - database: postgres
            test_database_url: postgresql+psycopg://slicepizza:slicepizza@localhost:5432/slicepizza_test
    services:
      postgres:
        # An empty image skips the service, so only the postgres leg starts it.
        image: ${{ matrix.database == 'postgres' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: slicepizza
          POSTGRES_PASSWORD: slicepizza
          POSTGRES_DB: slicepizza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U slicepizza -d slicepizza_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.test_database_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"  # same as the FROM line of api/Dockerfile
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: api
        run: pytest -q

  docker-smoke:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build images
        run: docker compose build

      - name: Start the stack and wait for health
        run: docker compose up -d --wait

      - name: Check health and menu
        run: |
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/menu

      # The way customers come in: Caddy on 8080 serves the site and forwards /api to the API.
      - name: Check the site and the API through Caddy
        run: |
          # No folder is mounted over /srv (docker-compose.yml), so these are
          # the files inside the web image, as published.
          curl -fsS http://127.0.0.1:8080/ | grep -q "Pizzeria"
          curl -fsS http://127.0.0.1:8080/app.js | grep -q "SLICEPIZZA_CONFIG"
          curl -fsS http://127.0.0.1:8080/config.js | grep -q "apiUrl"
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "^content-security-policy: default-src 'self'"
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/api/menu > /dev/null
          # The interactive docs must load their schema through the /api prefix.
          curl -fsS http://127.0.0.1:8080/api/docs | grep -q "/api/openapi.json"
          curl -fsS http://127.0.0.1:8080/api/openapi.json > /dev/null
          curl -fsS -X POST http://127.0.0.1:8080/api/orders \
            -H "Content-Type: application/json" \
            -d '{"customer":{"name":"CI","phone":"+55 11 90000-0000","address":"Rua do Teste, 1"},"items":[{"pizza_id":1,"quantity":1}]}'

      - name: Dump logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
