# Builds one Docker image; called by api-image.yml and web-image.yml, which only
# say which image and when. On a Pull Request it only checks that the image
# builds; on main (or the weekly rebuild) it publishes `latest` and `sha-<commit>`
# to GHCR, and the server picks up the new :latest within 5 minutes (docs/DEPLOY.md).
name: Build image

on:
  workflow_call:
    inputs:
      image:
        description: Full image name, e.g. ghcr.io/senatoreteam/slicepizza-api
        required: true
        type: string
      context:
        description: Build context folder
        required: true
        type: string
      file:
        description: Path to the Dockerfile
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build (and publish, except on a Pull Request)
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/amd64
          # Always check for a newer base image under the same tag (security fixes).
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One cache per image, so the two images don't evict each other's layers.
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
