name: slicepizza

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # Named volume: the data survives `docker compose down`.
      - pgdata:/var/lib/postgresql/data
    # Loopback only: lets you connect from your machine (psql, DBeaver or the API
    # running outside Docker) without exposing Postgres to the network.
    # If you already run Postgres on 5432, set POSTGRES_HOST_PORT in .env.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # -h 127.0.0.1 checks TCP, like the API does. Without it, pg_isready uses the
      # Unix socket and reports ready during first-boot init, before Postgres
      # accepts network connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    # Bind to the loopback interface only: this is a laptop dev stack.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Passed as separate variables (not a URL), so the password needs no encoding.
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # The web container serves the API under /api (see infra/caddy/Caddyfile).
      # This tells the API, so its interactive docs work at /api/docs.
      UVICORN_ROOT_PATH: /api
      # Trust the X-Forwarded-For/-Proto headers Caddy sends, so redirects keep
      # "https" and the client IP is the customer's. Port 8000 is not public.
      UVICORN_FORWARDED_ALLOW_IPS: "*"
    # Same restrictions as on the server (docs/DEPLOY.md).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The python:*-slim image has no curl, so use the standard library.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The way in: Caddy serves the menu site on http://localhost:8080 and
  # forwards http://localhost:8080/api/* to the API. The same image runs on
  # the server (infra/caddy/Dockerfile, ADR 0003), with the site files that
  # are inside it, so CI tests what gets published. To edit the site and just
  # reload the page, add docker-compose.site-dev.yml (see that file).
  web:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_UPSTREAM: api:8000
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # busybox wget is in the alpine image; /api/health checks the whole path.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
