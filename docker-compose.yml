name: slicepizza

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # Named volume: the data survives `docker compose down`.
      - pgdata:/var/lib/postgresql/data
    # Loopback only: lets you connect from your machine (psql, DBeaver or the API
    # running outside Docker) without exposing Postgres to the network.
    # If you already run Postgres on 5432, set POSTGRES_HOST_PORT in .env.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # -h 127.0.0.1 checks TCP, like the API does. Without it, pg_isready uses the
      # Unix socket and reports ready during first-boot init, before Postgres
      # accepts network connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    # Bind to the loopback interface only: this is a laptop dev stack.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Passed as separate variables (not a URL), so the password needs no encoding.
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The python:*-slim image has no curl, so use the standard library.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
